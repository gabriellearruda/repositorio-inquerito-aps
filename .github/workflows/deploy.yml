name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject password into vital/index.html
        env:
          SENHADOPAINEL: ${{ secrets.SENHADOPAINEL }}
        run: |
          python3 -c "
          import os
          with open('vital/index.html', 'r', encoding='utf-8') as f:
              content = f.read()
          content = content.replace('__SENHADOPAINEL__', os.environ['SENHADOPAINEL'])
          with open('vital/index.html', 'w', encoding='utf-8') as f:
              f.write(content)
          "

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
