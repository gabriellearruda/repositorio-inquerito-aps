name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject password into vital/index.html
        env:
          SENHADOPAINEL: ${{ secrets.SENHADOPAINEL }}
        run: |
          node -e "
            const fs = require('fs');
            const path = 'vital/index.html';
            let content = fs.readFileSync(path, 'utf8');
            const before = (content.match(/'__SENHADOPAINEL__'/g) || []).length;
            const escaped = JSON.stringify(process.env.SENHADOPAINEL);
            content = content.replace(\"'__SENHADOPAINEL__'\", escaped);
            const after = (content.match(/'__SENHADOPAINEL__'/g) || []).length;
            fs.writeFileSync(path, content, 'utf8');
            console.log('Placeholders antes:', before, '| depois:', after);
          "

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
