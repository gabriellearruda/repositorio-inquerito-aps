name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject password into vital/index.html
        env:
          SENHADOPAINEL: ${{ secrets.SENHADOPAINEL }}
        run: python3 -c "import os; f=open('vital/index.html','r',encoding='utf-8'); c=f.read(); f.close(); c=c.replace('__SENHADOPAINEL__',os.environ['SENHADOPAINEL']); f=open('vital/index.html','w',encoding='utf-8'); f.write(c); f.close()"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
