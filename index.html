<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inquérito APS por WhatsApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300;8..60,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',-apple-system,sans-serif;
  background:#0A1356;
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  min-height:100%;padding:2rem;
}
.wrap{max-width:520px;width:100%}
.eyebrow{
  font-size:.62rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(255,203,55,.8);margin-bottom:1.2rem;display:block;
}
h1{
  font-family:'Source Serif 4',Georgia,serif;
  font-size:2rem;font-weight:300;line-height:1.15;
  color:#fff;margin-bottom:1rem;
}
h1 em{font-style:italic;color:rgba(227,106,87,.9)}
p{
  font-size:.88rem;line-height:1.75;
  color:rgba(255,255,255,.55);margin-bottom:2rem;
}
.divider{
  width:32px;height:2px;background:rgba(255,203,55,.4);margin-bottom:2rem;
}
.status{
  display:inline-flex;align-items:center;gap:.5rem;
  font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:rgba(255,255,255,.3);
}
.status-dot{
  width:6px;height:6px;border-radius:50%;
  background:#25D366;box-shadow:0 0 6px #25D366;
}
</style>
</head>
<body>
<div class="wrap">
  <span class="eyebrow">MDMS Brasil · Recife</span>
  <h1>Usando a <em>tecnologia</em> para avaliar a APS em alto alcance</h1>
  <div class="divider"></div>
  <p>O guia de replicação deste inquérito estará disponível em breve.</p>
  <span class="status"><span class="status-dot"></span>Em construção</span>
</div>
</body>
</html>
